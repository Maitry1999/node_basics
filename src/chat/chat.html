<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center text-blue-600">Chat App 💬</h2>

        <!-- User ID Input -->
        <div id="userIdSection" class="mt-4">
            <input id="username" class="w-full p-2 border rounded" type="text" placeholder="Enter your User ID">
            <button onclick="setUserId()" class="w-full bg-blue-500 text-white py-2 rounded mt-2">Enter</button>
        </div>

        <!-- User List -->
        <div id="userListSection" class="hidden mt-4">
            <h3 class="text-lg font-bold">Users</h3>
            <ul id="userList" class="mt-2 space-y-2"></ul>
        </div>

        <!-- Chat Section -->
        <div id="chatSection" class="hidden mt-4">
            <h3 id="chatHeader" class="text-lg font-bold"></h3>
            <ul id="messages" class="mt-2 space-y-2 max-h-60 overflow-auto p-2 border rounded bg-gray-50"></ul>

            <input id="message" class="w-full p-2 border rounded mt-2" type="text" placeholder="Type a message...">
            <button onclick="sendMessage()" class="w-full bg-green-500 text-white py-2 rounded mt-2">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
