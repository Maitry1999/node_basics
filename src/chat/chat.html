<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center text-blue-600">Chat App 💬</h2>

        <div class="mt-4 space-y-2">
            <input id="username" class="w-full p-2 border rounded" type="text" placeholder="Enter your user ID">
            <input id="receiver" class="w-full p-2 border rounded" type="text"
                placeholder="Receiver ID (for private chat)">
            <input id="group" class="w-full p-2 border rounded" type="text" placeholder="Group ID (for group chat)">
            <input id="message" class="w-full p-2 border rounded" type="text" placeholder="Type a message...">
        </div>

        <div class="flex justify-between mt-4 space-x-2">
            <button onclick="sendPrivateMessage()" class="w-1/3 bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                Send Private
            </button>
            <button onclick="sendGroupMessage()" class="w-1/3 bg-green-500 text-white py-2 rounded hover:bg-green-600">
                Send Group
            </button>
            <button onclick="joinGroup()" class="w-1/3 bg-purple-500 text-white py-2 rounded hover:bg-purple-600">
                Join Group
            </button>
        </div>

        <ul id="messages" class="mt-4 space-y-2 max-h-60 overflow-auto p-2 border rounded bg-gray-50"></ul>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
